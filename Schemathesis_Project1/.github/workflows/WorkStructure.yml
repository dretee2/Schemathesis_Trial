name: Schemathesis Services Tests

on:
  push:
    branches: [ contract-testing ]
  pull_request:
  schedule:
    - cron: '0 1 * * *'  # Runs every day at 1 AM UTC

jobs:
  run-contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        testfile:
          - tests/test_user_management.py
          - tests/test_recommendations.py
          - tests/test_chat.py
          - tests/test_alerts.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "API_EMAIL=${{ secrets.API_EMAIL }}" >> $GITHUB_ENV
          echo "API_PASSWORD=${{ secrets.API_PASSWORD }}" >> $GITHUB_ENV

      - name: Run tests with pytest
        run: |
          mkdir -p reports
          pytest -v ${{ matrix.testfile }} \
            --junit-xml=reports/contract-report-${{ matrix.testfile }}.xml \
            --html=reports/report-${{ matrix.testfile }}.html \
            --self-contained-html

      # Optional: Email report
      - name: Email HTML Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Contract Test Report for ${{ matrix.testfile }}
          body: "Attached is the latest contract test report."
          to: uyahanthony2@gmial.com
          from: Contract Tests <qa-team@example.com>
          attachments: reports/report-${{ matrix.testfile }}.html
