name: Schemathesis Contract Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Schemathesis tests
        run: |
          schemathesis run https://petstore.swagger.io/v2/swagger.json --hypothesis-max-examples=50 --junit-xml=reports/contract-report.xml --report=reports/report.html
