name: Schemathesis Contract Tests

on:
  push:
    branches: [ contract-testing ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tramatch Recommendation tests
        run: |
          pytest -v --junit-xml=reports/contract-report.xml --html=reports/report.html --self-contained-html
